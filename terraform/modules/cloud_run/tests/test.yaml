project_id: "vf-gned-ngdi-alpha-pltfrm-orch"
region: "europe-west2"

terraform:
  required_version: ">= 1.14.0"
  providers:
    google: ">= 7.17.0, < 8.0.0"

project_services:
  source:
    version: v1.0.2
  depends_on: []
  spec:
    - name: "cloud-run-required-apis"
      service_list:
        - "run.googleapis.com"
      service_config:
        disable_on_destroy: false
        disable_dependent_services: false

cloud_run:
  source:
    version: v1.0.3
  depends_on:
    - project_services
  spec:
    - name: "test-cloud-run-2"
      type: "SERVICE"
      containers:
        turing-processor:
          image: "europe-west1-docker.pkg.dev/vf-gned-ngdi-alpha-pltfrm-orch/cloud-run-source-deploy/test-cloud-run:latest"
          options: 
            command: null
            args: null        
          ports: 
            "http1": 
              container_port: 8080  
          resources: 
            limits: 
              cpu: 4
              memory: 8Gi           
      iam:
        roles/run.invoker:
          - serviceAccount:turing-batch-sa@vf-gned-ngdi-mob-beta-ing.iam.gserviceaccount.com
      service_account_config:
        create: false
        email: turing-batch-sa@vf-gned-ngdi-mob-beta-ing.iam.gserviceaccount.com