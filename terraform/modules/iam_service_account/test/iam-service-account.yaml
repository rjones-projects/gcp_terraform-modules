project_id: "vf-gned-ngdi-alpha-pltfrm-orch"
region: "europe-west2"

terraform:
  required_version: ">= 1.14.0"
  providers:
    google: ">= 7.17.0, < 8.0.0"

iam_service_account:
  source:
    version: v1.1.0
  depends_on: []
  spec: 
    - name: "vf-gned-ngdi-alpha-pltfrm-orch"
      iam_project_roles:
        - "roles/composer.worker"
    
    - name: "composer-sa"
      iam_project_roles:
        - "roles/dataform.serviceAgent"
        - "roles/iam.serviceAccountTokenCreator"
      iam_bindings:
        "serviceAccount:vf-gned-ngdi-alpha-pltfrm-orch@vf-gned-ngdi-alpha-pltfrm-orch.iam.gserviceaccount.com":
          - "roles/iam.serviceAccountUser"
        "group:testgroup":
          - "roles/iam.serviceAccountUser"

    - name: "test-sa"
      project_id: vf-gned-ngdi-alpha-pltfrm-orch
      service_account_reuse: true
      iam_project_roles:
        - "roles/dataform.serviceAgent"
        - "roles/iam.serviceAccountTokenCreator"