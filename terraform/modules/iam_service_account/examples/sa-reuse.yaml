project_id: "project_id"

terraform:
  required_version: ">= 1.14.0"
  providers:
    google: ">= 7.17.0, < 8.0.0"

iam_service_account:
  source:
    version: v1.1.0
  depends_on: []
  spec: 
    - name: "tester-sa"
      project_id: "project_id_where_sa_exists"
      # Set service_account_reuse to true to use existing sa
      service_account_reuse: true
      
      iam_project_roles:
        # Roles will be added to project ID specified on line 1
        - "roles/iam.serviceAccountTokenCreator"
